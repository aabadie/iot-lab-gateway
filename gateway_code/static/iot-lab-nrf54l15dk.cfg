source [find interface/jlink.cfg]

transport select swd

source [find target/nordic/nrf54l.cfg]

flash bank $_CHIPNAME.flash nrf54 0x00000000 0 0 0 $_TARGETNAME

# A firmware can lock the debug access (UICR APPROTECT or TAMPC signal
# protectors): the AHB-AP is then disabled and the examination fails.
# Erase and unlock the device with the CTRL-AP ERASEALL instead of leaving
# the node unusable, see "Disabling APPROTECT" in the nRF54L documentation.
proc iotlab_nrf54l_recover {} {
	set target [target current]
	set dap [$target cget -dap]

	# AHB-AP CSW DeviceEn
	if {[$dap apreg 0 0x0] & 0x40} {
		return
	}
	echo "nRF54L debug access is locked, erase and unlock the device"
	poll off

	for {set attempt 1} {$attempt <= 3} {incr attempt} {
		# CTRL-AP ERASEALL, then wait for ERASEALLSTATUS not Busy (2)
		$dap apreg 2 0x4 1
		for {set i 0} {1} {incr i} {
			set status [$dap apreg 2 0x8]
			if {$status != 2} {
				break
			}
			if {$i >= 50} {
				echo "Error: nRF54L erase timeout"
				return
			}
			sleep 100
		}

		# ReadyToReset (1): apply the erase with a CTRL-AP hard reset
		if {$status == 1} {
			$dap apreg 2 0x0 2
			$dap apreg 2 0x0 0
			sleep 100
			$target arp_examine
			poll on
			echo "nRF54L device erased and unlocked"
			return
		}

		# Erase failed: CTRL-AP pin reset and retry
		echo "nRF54L erase failed with status $status, attempt $attempt"
		$dap apreg 2 0x0 4
		$dap apreg 2 0x0 0
	}
	echo "Error: nRF54L recovery failed"
}

$_TARGETNAME configure -event examine-fail iotlab_nrf54l_recover
